</dialog>

<script>
const DATA_PATH='data.json',COLORS=['#f4c24d','#ef6a74','#5db8f0','#7fe0a8','#c9a0f5','#f5a05f','#8fe3e3','#ece383'],SPEED={Slow:2200,Normal:1500,Fast:900};
const ROLES=[['solo','Solo',2],['duo','Duo',4],['trio','Trio',3],['quadro','Quadro',4],['leader','Leader',1],['props','Props men',0],['bg','Background',0]],RC={solo:'#ef6a74',duo:'#c9a0f5',trio:'#7fe0a8',quadro:'#f5a05f',leader:'#f0ce72',props:'#70c7b3',bg:'#8d9bb8'},RS={solo:'S',duo:'D',trio:'T',quadro:'Q',leader:'L',props:'P'},SC={A:'#f4c24d',B:'#5db8f0'};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,8),clamp=v=>Math.max(2.5,Math.min(97.5,v));
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(l,f,c)=>{const b=el('button',c,l);b.onclick=f;return b};
const chk=(l,v,f)=>{const L=el('label','chk'),c=el('input');c.type='checkbox';c.checked=v;c.onchange=()=>f(c.checked);L.append(c,' '+l);return L};
const stage=$('stage'),wrap=$('wrap');
const CELL=72,GW=80,GH=50,FW=GW*CELL,FH=GH*CELL,TOT={solo:2,duo:2};
stage.style.width=FW+'px';stage.style.height=FH+'px';stage.style.setProperty('--cell',CELL+'px');
const displayDefaults={page:1,text:1,controls:1,marker:46,pad:52,lensW:0,lensH:0};
const viewNumber=(v,min,max,base)=>{v=Number(v);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):base};
let viewPrefs=(()=>{let v={};try{v=JSON.parse(localStorage.getItem('arnis_view_settings')||'{}')||{}}catch{}return{page:viewNumber(v.page,.8,1.25,1),text:viewNumber(v.text,.8,1.4,1),controls:viewNumber(v.controls,.8,1.4,1),marker:viewNumber(v.marker,20,64,innerWidth<600?34:46),pad:viewNumber(v.pad,36,72,52),lensW:viewNumber(v.lensW,0,3000,0),lensH:viewNumber(v.lensH,0,1600,0)}})();

const saved=JSON.parse(localStorage.getItem('arnis_cfg')||'{}');
const guess=location.hostname.endsWith('github.io')?{owner:location.hostname.split('.')[0],repo:location.pathname.split('/')[1]||''}:{};
let cfg={owner:saved.owner||guess.owner||'',repo:saved.repo||guess.repo||'',branch:saved.branch||'main'},token=localStorage.getItem('arnis_token')||'';
let data=norm({}),zoom=1,spaceDown=false,colorBy='custom',fSet='',fRole='',cur=0,admin=false,dirty=false,snap=false,ghost=true,mode='num',tab='people',qs='',playing=null,speed='Normal',size=viewPrefs.marker,rowsVal=0,hist=[],fut=[],lastNudge=0;
const sel=new Set(),blocks={};let assignTarget=null,assignSelection=new Set(),assignQuery='',assignmentStroke=null,nudgeStep=1,nudgeHold=null;
let swapMode=false,swapA=null,colsVal=0;
const F=()=>data.formations[cur],P=id=>data.people.find(p=>p.id===id);
function applyViewPrefs(){const r=document.documentElement.style;r.setProperty('--ui-scale',viewPrefs.page);r.setProperty('--text-scale',viewPrefs.text);r.setProperty('--control-scale',viewPrefs.controls);r.setProperty('--s',viewPrefs.marker+'px');r.setProperty('--dpad-size',viewPrefs.pad+'px');r.setProperty('--lw',viewPrefs.lensW?viewPrefs.lensW+'px':'100%');r.setProperty('--lh',(viewPrefs.lensH||Math.round(Math.min(640,Math.max(340,innerHeight*.6))))+'px');size=viewPrefs.marker}
function persistViewPrefs(){applyViewPrefs();localStorage.setItem('arnis_view_settings',JSON.stringify(viewPrefs))}
let uniK='',uniM={};
function uniMap(){const k=data.people.map(p=>p.id+p.name).join('|');if(k===uniK)return uniM;uniK=k;uniM={};const used=new Set(),stripVowels=s=>s.replace(/[aeiouáéíóúü]/gi,'');
 data.people.forEach(p=>{const w=p.name.trim().split(/\s+/).filter(Boolean),first=w[0]||'?',stem=first[0].toUpperCase()+stripVowels(first.slice(1)).toLowerCase(),last=w.length>1?w[w.length-1]:'';
  let label=last?stem+'.'+last[0].toUpperCase():stem;const base=label;for(let i=2;used.has(label);i++)label=base+i;used.add(label);uniM[p.id]=label});return uniM}
const ini=p=>uniMap()[p.id]||'?';
function norm(d){d.title=d.title||'Arnis Formations';d.people=d.people||[];d.people.forEach(p=>{p.set=p.set||'';p.role=p.role||'bg'});
 d.formations=d.formations&&d.formations.length?d.formations:[{id:uid(),name:'Formation 1',note:'',pos:{}}];
 const old=!d.v;d.v=2;/* v2 = positions are floor boxes (col+.5,row+.5); older files used % of a small stage */
 d.formations.forEach(f=>{f.note=f.note||'';f.pos=f.pos||{};const used=new Set();
  d.people.forEach(p=>{let q=f.pos[p.id];if(q&&!Array.isArray(q))q=[q.x,q.y];if(!q){delete f.pos[p.id];return}
   if(old){const c=freeIn(Math.floor(q[0]/100*30)+(GW-30)/2,Math.floor(q[1]/100*19)+Math.floor((GH-19)/2),used);q=[c[0]+.5,c[1]+.5]}
   used.add(Math.floor(q[0])+','+Math.floor(q[1]));f.pos[p.id]=q})});return d}
function freeIn(c,r,occ){c=Math.max(0,Math.min(GW-1,Math.round(c)));r=Math.max(0,Math.min(GH-1,Math.round(r)));
 for(let d=0;d<GW;d++)for(let dy=-d;dy<=d;dy++)for(let dx=-d;dx<=d;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==d)continue;const x=c+dx,y=r+dy;if(x>=0&&y>=0&&x<GW&&y<GH&&!occ.has(x+','+y))return[x,y]}return[c,r]}
const cc=p=>[Math.floor(p[0]),Math.floor(p[1])],ck=(c,r)=>c+','+r,R2=Math.round,placed=id=>!!F().pos[id];
function occOf(skip){const o=new Set();for(const i in F().pos)if(!skip||!skip.has(i)){const c=cc(F().pos[i]);o.add(ck(c[0],c[1]))}return o}
function putCell(id,c,r,occ){const f=freeIn(c,r,occ);occ.add(ck(f[0],f[1]));F().pos[id]=[f[0]+.5,f[1]+.5]}

/* ---------- GitHub I/O (admins use the API, viewers read the published data.json) ---------- */
const api=(m,p,b)=>fetch('https://api.github.com'+p,{method:m,cache:'no-store',headers:{Accept:'application/vnd.github+json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const fp=()=>`/repos/${cfg.owner}/${cfg.repo}/contents/${DATA_PATH}?ref=${cfg.branch}&t=${Date.now()}`;
let stT;function setStatus(t){const x=$('status');x.textContent=t;x.classList.toggle('show',!!t);clearTimeout(stT);if(t)stT=setTimeout(()=>x.classList.remove('show'),4500)}
async function load(silent){
 try{let txt;
  if(admin&&cfg.owner){const r=await api('GET',fp());if(r.status===404)return setStatus('No data.json yet. Add people and press Save.');if(!r.ok)throw new Error('HTTP '+r.status);txt=dec((await r.json()).content)}
  else{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.status===404)return setStatus('No formations published yet.');if(!r.ok)throw new Error('HTTP '+r.status);txt=await r.text()}
  const nd=norm(JSON.parse(txt));if(JSON.stringify(nd)===JSON.stringify(data))return;
  data=nd;cur=Math.min(cur,data.formations.length-1);render();if(!silent)setStatus('Loaded latest formations.')
 }catch(e){if(!silent)setStatus('Preview mode (no published data yet): '+e.message)}}
async function save(){
 setStatus('Saving…');
 try{const h=await api('GET',fp()),b={message:'Update formations',content:enc(JSON.stringify(data)),branch:cfg.branch};
  if(h.ok)b.sha=(await h.json()).sha;
  const r=await api('PUT',`/repos/${cfg.owner}/${cfg.repo}/contents/${DATA_PATH}`,b);
  if(!r.ok)throw new Error(r.status===401||r.status===403?'token cannot write to this repo':'HTTP '+r.status);
  dirty=false;renderTools();renderDock();setStatus('Saved. Viewers see it within about a minute.')
 }catch(e){setStatus('Save failed: '+e.message)}}
function openLogin(){$('o').value=cfg.owner;$('r').value=cfg.repo;$('b').value=cfg.branch;$('t').value='';$('login').showModal()}
async function signIn(e){
 e.preventDefault();const old={cfg:{...cfg},token};
 cfg={owner:$('o').value.trim(),repo:$('r').value.trim(),branch:$('b').value.trim()};token=$('t').value.trim();
 const r=await api('GET',`/repos/${cfg.owner}/${cfg.repo}`).catch(()=>null),i=r&&r.ok?await r.json():null;
 $('login').close();
 if(!i||!i.permissions||!i.permissions.push){cfg=old.cfg;token=old.token;return setStatus('Sign in failed: check username, repo, and that the token can write.')}
 localStorage.setItem('arnis_cfg',JSON.stringify(cfg));localStorage.setItem('arnis_token',token);
 admin=true;await load(true);render();setStatus('Signed in as admin.')}
function signOut(){if(dirty&&!confirm('Discard unsaved changes?'))return;localStorage.removeItem('arnis_token');token='';admin=false;dirty=false;hist=[];fut=[];sel.clear();load(true).then(render);render()}

/* ---------- Editing core ---------- */
const snapshot=()=>{hist.push(JSON.stringify(data));if(hist.length>80)hist.shift();fut=[]};
const mark=()=>{dirty=true;renderTop();renderTools();renderDock()};
const edit=fn=>{snapshot();fn();mark();render()};
function fix(){cur=Math.min(cur,data.formations.length-1);[...sel].forEach(i=>{if(!P(i))sel.delete(i)});render()}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(data));data=JSON.parse(hist.pop());fix();mark()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(data));data=JSON.parse(fut.pop());fix();mark()}
function movePos(fn){snapshot();fn();mark();stage.classList.add('anim');afterPlace();setTimeout(()=>{if(!playing)stage.classList.remove('anim')},900)}
function afterPlace(){syncBlocks();renderCabinet();if(menu.open&&tab==='people')renderPane()}

function addP(names){if(!names.length)return;edit(()=>{const s=data.people.length;data.people.push(...names.map((n,i)=>({id:uid(),name:n,color:COLORS[(s+i)%COLORS.length],set:'',role:'bg'})))});setStatus(names.length+' added to the People cabinet. Drag them onto the floor.')}
function delP(ids){edit(()=>{data.people=data.people.filter(p=>!ids.includes(p.id));data.formations.forEach(f=>ids.forEach(i=>delete f.pos[i]));ids.forEach(i=>sel.delete(i))})}
function addF(copy){edit(()=>{const pos=copy?JSON.parse(JSON.stringify(F().pos)):{};
 data.formations.splice(cur+1,0,{id:uid(),name:'Formation '+(data.formations.length+1),note:copy?F().note:'',pos});cur++})}
function renF(){const n=prompt('Formation name',F().name);if(n&&n.trim())edit(()=>F().name=n.trim())}
function delF(){if(data.formations.length<2)return setStatus('Keep at least one formation.');if(confirm('Delete "'+F().name+'"?'))edit(()=>{data.formations.splice(cur,1);cur=Math.max(0,cur-1)})}
function moveF(d){const j=cur+d;if(j<0||j>=data.formations.length)return;edit(()=>{[data.formations[cur],data.formations[j]]=[data.formations[j],data.formations[cur]];cur=j})}
function setCur(i){if(playing)stop();cur=i;history.replaceState(null,'','#'+(i+1));render()}

/* ---------- Arrange tools ---------- */
const L={
 grid:(n,r)=>{r=r||Math.max(1,R2(Math.sqrt(n/1.6)));const c=Math.ceil(n/r);return Array.from({length:n},(_,i)=>[i%c-((c-1)>>1),Math.floor(i/c)-((r-1)>>1)])},
 gridc:(n,c)=>{c=c||Math.max(1,R2(Math.sqrt(n*1.6)));const r=Math.ceil(n/c);return Array.from({length:n},(_,i)=>[Math.floor(i/r)-((c-1)>>1),i%r-((r-1)>>1)])},
 circle:n=>{const R=Math.max(2, n/6);return Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2-Math.PI/2;return[R2(R*Math.cos(a)),R2(R*Math.sin(a))]})},
